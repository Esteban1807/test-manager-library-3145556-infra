# Manager Library — infrastructure (tasks T-20, RNF-5).
# One command: docker compose up --build
#
# This repo only brings up containers, the network, the volumes and an EMPTY database engine.
# It contains no DDL: the schema belongs to the API migrations (constitution Article V, ADR-001).
# The API and the frontend are built from their sibling repositories.

name: manager-library

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-library}
      POSTGRES_USER: ${DB_USERNAME:-library}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-library} -d ${DB_DATABASE:-library}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [library]

  api:
    build:
      context: ${API_PATH:-../test-manager-library-3145556-api}
      dockerfile_inline: |
        FROM php:8.3-cli
        RUN apt-get update \
            && apt-get install -y --no-install-recommends libpq-dev libargon2-dev unzip git \
            && docker-php-ext-install pdo_pgsql \
            && rm -rf /var/lib/apt/lists/*
        COPY --from=composer:2 /usr/bin/composer /usr/bin/composer
        WORKDIR /app
        COPY . .
        RUN composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
        EXPOSE 8000
        # The schema is created here, by the application's own migrations, never by this repo
        CMD ["sh", "-c", "php artisan migrate --force && php artisan library:bootstrap-admin && php artisan serve --host=0.0.0.0 --port=8000"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Define APP_KEY en .env}
      APP_URL: http://localhost:${API_PORT:-8000}
      LOG_CHANNEL: stderr
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-library}
      DB_USERNAME: ${DB_USERNAME:-library}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Define ADMIN_USERNAME en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      CORS_ALLOWED_ORIGINS: http://localhost:${APP_PORT:-5173}
      LIBRARY_DEMO_CLOCK: ${LIBRARY_DEMO_CLOCK:-false}
    volumes:
      - covers:/app/storage/app/private
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [library]

  app:
    build:
      context: ${APP_PATH:-../test-manager-library-3145556-app}
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8000}/api/v1
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci
        COPY . .
        ARG VITE_API_URL
        ENV VITE_API_URL=$$VITE_API_URL
        RUN npm run build

        FROM nginx:1.27-alpine
        COPY --from=build /app/dist /usr/share/nginx/html
        # Single-page app: unknown paths fall back to index.html
        RUN printf 'server {\n  listen 80;\n  root /usr/share/nginx/html;\n  location / { try_files $$uri /index.html; }\n}\n' > /etc/nginx/conf.d/default.conf
        EXPOSE 80
    ports:
      - "${APP_PORT:-5173}:80"
    depends_on: [api]
    networks: [library]

networks:
  library:

volumes:
  db-data:
  covers:
